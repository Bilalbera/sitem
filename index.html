<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BilalAI 0.02</title>
  <meta name="description" content="BilalAI 0.02 sohbet arayüzü">
  <style>
    :root{
      --bg:#0a0d12;
      --panel:#10151d;
      --panel-2:#151b25;
      --border:#263142;
      --text:#f3f6fb;
      --muted:#8d99aa;
      --accent:#6ea8fe;
      --accent-2:#4f7dff;
      --user:#1b2738;
      --bot:#111a25;
      --danger:#ff6b6b;
      --shadow:0 18px 50px rgba(0,0,0,.28);
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top left, rgba(79,125,255,.12), transparent 28%),
        radial-gradient(circle at bottom right, rgba(110,168,254,.08), transparent 24%),
        var(--bg);
      overflow:hidden;
    }

    button,input{font:inherit}

    .app{
      height:100%;
      display:grid;
      grid-template-columns:270px minmax(0,1fr);
    }

    .sidebar{
      border-right:1px solid var(--border);
      background:rgba(13,18,26,.88);
      backdrop-filter:blur(16px);
      display:flex;
      flex-direction:column;
      padding:18px;
      gap:16px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      padding:8px 4px 14px;
      border-bottom:1px solid var(--border);
    }

    .logo{
      width:42px;height:42px;border-radius:13px;
      display:grid;place-items:center;
      background:linear-gradient(135deg,var(--accent-2),var(--accent));
      color:white;font-size:21px;font-weight:800;
      box-shadow:0 10px 28px rgba(79,125,255,.24);
    }

    .brand h1{margin:0;font-size:16px}
    .brand p{margin:4px 0 0;color:var(--muted);font-size:12px}

    .sidebar-btn{
      width:100%;
      border:1px solid var(--border);
      background:var(--panel);
      color:var(--text);
      padding:11px 12px;
      border-radius:11px;
      cursor:pointer;
      text-align:left;
      transition:.18s ease;
    }

    .sidebar-btn:hover{
      border-color:#3b4a61;
      background:var(--panel-2);
      transform:translateY(-1px);
    }

    .info-card{
      margin-top:auto;
      padding:13px;
      border:1px solid var(--border);
      border-radius:13px;
      background:rgba(16,21,29,.8);
    }

    .info-row{
      display:flex;
      justify-content:space-between;
      gap:10px;
      font-size:12px;
      margin:7px 0;
    }
    .info-row span:first-child{color:var(--muted)}
    .online{color:#7de2a7}

    .main{
      min-width:0;
      display:grid;
      grid-template-rows:70px minmax(0,1fr) auto;
      height:100%;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 22px;
      border-bottom:1px solid var(--border);
      background:rgba(10,13,18,.66);
      backdrop-filter:blur(12px);
    }

    .title-wrap{
      display:flex;align-items:center;gap:11px;
    }

    .status-dot{
      width:9px;height:9px;border-radius:50%;
      background:#7de2a7;
      box-shadow:0 0 14px rgba(125,226,167,.7);
    }

    .title-wrap h2{margin:0;font-size:15px}
    .title-wrap span{font-size:12px;color:var(--muted)}

    .top-actions{display:flex;gap:8px}
    .icon-btn{
      width:38px;height:38px;border-radius:10px;
      border:1px solid var(--border);
      background:var(--panel);
      color:var(--text);cursor:pointer;
      display:grid;place-items:center;
    }
    .icon-btn:hover{background:var(--panel-2)}

    .chat{
      overflow-y:auto;
      padding:26px clamp(14px,4vw,54px) 20px;
      scroll-behavior:smooth;
    }

    .messages{
      max-width:920px;
      margin:0 auto;
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .message{
      display:flex;
      gap:11px;
      align-items:flex-start;
      animation:fadeUp .2s ease;
    }

    @keyframes fadeUp{
      from{opacity:0;transform:translateY(5px)}
      to{opacity:1;transform:none}
    }

    .message.user{justify-content:flex-end}
    .avatar{
      flex:0 0 34px;
      width:34px;height:34px;border-radius:10px;
      display:grid;place-items:center;
      font-size:14px;font-weight:800;
      border:1px solid var(--border);
      background:var(--panel-2);
    }

    .message.user .avatar{order:2}

    .bubble{
      max-width:min(78%,760px);
      padding:12px 14px;
      border:1px solid var(--border);
      border-radius:14px;
      line-height:1.55;
      white-space:pre-wrap;
      word-break:break-word;
      box-shadow:0 7px 22px rgba(0,0,0,.14);
    }

    .message.bot .bubble{
      background:var(--bot);
      border-top-left-radius:5px;
    }

    .message.user .bubble{
      background:var(--user);
      border-top-right-radius:5px;
    }

    .meta{
      margin-top:6px;
      font-size:10px;
      color:var(--muted);
    }

    .composer{
      padding:14px clamp(14px,4vw,54px) 18px;
      border-top:1px solid var(--border);
      background:linear-gradient(to top, rgba(10,13,18,.98), rgba(10,13,18,.86));
    }

    .composer-inner{
      max-width:920px;
      margin:0 auto;
      display:flex;
      gap:10px;
      align-items:flex-end;
      border:1px solid var(--border);
      background:var(--panel);
      padding:9px;
      border-radius:15px;
      box-shadow:var(--shadow);
    }

    .message-input{
      flex:1;
      min-width:0;
      border:0;outline:0;
      background:transparent;
      color:var(--text);
      resize:none;
      max-height:150px;
      min-height:44px;
      padding:10px 9px;
      line-height:1.45;
    }

    .message-input::placeholder{color:#657184}

    .send-btn{
      flex:0 0 auto;
      border:0;
      min-width:94px;
      height:44px;
      padding:0 16px;
      border-radius:11px;
      cursor:pointer;
      color:#fff;
      background:linear-gradient(135deg,var(--accent-2),var(--accent));
      font-weight:700;
      transition:.18s ease;
    }

    .send-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
    .send-btn:disabled{opacity:.55;cursor:not-allowed;transform:none}

    .hint{
      max-width:920px;
      margin:8px auto 0;
      color:var(--muted);
      font-size:11px;
      text-align:center;
    }

    .typing{
      display:inline-flex;align-items:center;gap:4px;
      padding:13px 14px;
      border:1px solid var(--border);
      border-radius:14px;
      background:var(--bot);
    }

    .typing i{
      width:6px;height:6px;border-radius:50%;
      background:#8896a8;
      animation:bounce 1s infinite ease-in-out;
    }
    .typing i:nth-child(2){animation-delay:.15s}
    .typing i:nth-child(3){animation-delay:.3s}

    @keyframes bounce{
      0%,80%,100%{transform:translateY(0);opacity:.5}
      40%{transform:translateY(-4px);opacity:1}
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:84px;
      transform:translateX(-50%) translateY(14px);
      padding:10px 14px;
      border-radius:10px;
      background:#1a2432;
      border:1px solid var(--border);
      color:var(--text);
      font-size:12px;
      opacity:0;
      pointer-events:none;
      transition:.2s ease;
      z-index:20;
    }
    .toast.show{opacity:1;transform:translateX(-50%)}

    @media (max-width:850px){
      .app{grid-template-columns:1fr}
      .sidebar{display:none}
      .main{grid-template-rows:62px minmax(0,1fr) auto}
      .topbar{padding:0 12px}
      .chat{padding:18px 10px 14px}
      .composer{padding:10px 10px 14px}
      .bubble{max-width:86%}
    }

    @media (max-width:520px){
      .send-btn{min-width:48px;padding:0 12px;font-size:0}
      .send-btn::after{content:"➤";font-size:16px}
      .top-actions .icon-btn:nth-child(2){display:none}
    }
  </style>
</head>
<body>
  <div class="app">

    <aside class="sidebar">
      <div class="brand">
        <div class="logo">⚡</div>
        <div>
          <h1>BilalAI</h1>
          <p>Flash 0.02</p>
        </div>
      </div>

      <button class="sidebar-btn" id="newChatBtn">＋ Yeni sohbet</button>
      <button class="sidebar-btn" id="clearBtn">⌫ Sohbeti temizle</button>

      <div class="info-card">
        <div class="info-row"><span>Motor</span><strong>bilalai.py</strong></div>
        <div class="info-row"><span>Sürüm</span><strong>0.02</strong></div>
        <div class="info-row"><span>Durum</span><strong class="online">● Çevrimiçi</strong></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="title-wrap">
          <div class="status-dot"></div>
          <div>
            <h2>BilalAI 0.02</h2>
            <span>Python motoru ile bağlı</span>
          </div>
        </div>

        <div class="top-actions">
          <button class="icon-btn" id="clearTopBtn" title="Sohbeti temizle">⌫</button>
          <button class="icon-btn" id="focusBtn" title="Mesaj kutusuna odaklan">⌕</button>
        </div>
      </header>

      <section class="chat" id="chat">
        <div class="messages" id="messages"></div>
      </section>

      <section class="composer">
        <div class="composer-inner">
          <textarea
            id="messageInput"
            class="message-input"
            rows="1"
            placeholder="BilalAI'a bir şey sor..."
            aria-label="Mesaj"
          ></textarea>
          <button id="sendBtn" class="send-btn">Gönder</button>
        </div>
        <div class="hint">Enter = gönder · Shift + Enter = yeni satır</div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /*
      BilalAI Python bağlantısı:
      index.html, aynı sunucudaki POST /chat adresine mesaj gönderir.

      Beklenen istek:
      { "message": "merhaba" }

      Beklenen cevap:
      { "response": "BilalAI: Selam dostum!" }
    */

    const API_URL = "/chat";

    const messagesEl = document.getElementById("messages");
    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const toastEl = document.getElementById("toast");

    let typingEl = null;
    let history = [];

    function nowTime(){
      return new Intl.DateTimeFormat("tr-TR", {
        hour: "2-digit",
        minute: "2-digit"
      }).format(new Date());
    }

    function escapeHtml(text){
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function addMessage(role, text, save = true){
      const wrapper = document.createElement("div");
      wrapper.className = `message ${role}`;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "S" : "⚡";

      const content = document.createElement("div");
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = escapeHtml(text);

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `${role === "user" ? "Sen" : "BilalAI"} · ${nowTime()}`;

      content.appendChild(bubble);
      content.appendChild(meta);
      wrapper.appendChild(avatar);
      wrapper.appendChild(content);
      messagesEl.appendChild(wrapper);

      if(save){
        history.push({role, content:text});
        localStorage.setItem("bilalai_history", JSON.stringify(history));
      }

      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function showTyping(){
      if(typingEl) return;

      typingEl = document.createElement("div");
      typingEl.className = "message bot";
      typingEl.innerHTML = `
        <div class="avatar">⚡</div>
        <div>
          <div class="typing"><i></i><i></i><i></i></div>
          <div class="meta">BilalAI · düşünüyor...</div>
        </div>
      `;

      messagesEl.appendChild(typingEl);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function hideTyping(){
      if(typingEl){
        typingEl.remove();
        typingEl = null;
      }
    }

    function showToast(message){
      toastEl.textContent = message;
      toastEl.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => {
        toastEl.classList.remove("show");
      }, 2200);
    }

    function autoResize(){
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 150) + "px";
    }

    async function sendMessage(){
      const message = inputEl.value.trim();

      if(!message || sendBtn.disabled) return;

      addMessage("user", message);
      inputEl.value = "";
      autoResize();
      sendBtn.disabled = true;
      showTyping();

      try{
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message
          })
        });

        if(!response.ok){
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        if(typeof data.response !== "string"){
          throw new Error("Geçersiz API cevabı");
        }

        hideTyping();
        addMessage("bot", data.response);

      }catch(error){
        hideTyping();
        addMessage(
          "bot",
          "BilalAI: Python sunucusuna bağlanamadım. bilalai.py çalışıyor mu?"
        );
        showToast("Python bağlantısı başarısız");
        console.error(error);
      }finally{
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    function clearChat(){
      history = [];
      localStorage.removeItem("bilalai_history");
      messagesEl.innerHTML = "";
      addMessage("bot", "BilalAI: Merhaba! BilalAI'a hoşgeldin. Ne çözmek istersin?", false);
    }

    function loadHistory(){
      try{
        const saved = JSON.parse(localStorage.getItem("bilalai_history"));

        if(Array.isArray(saved) && saved.length){
          history = saved;
          saved.forEach(item => {
            if(item && (item.role === "user" || item.role === "bot")){
              addMessage(item.role, String(item.content), false);
            }
          });
        }else{
          addMessage("bot", "BilalAI: Merhaba! BilalAI'a hoşgeldin. Ne çözmek istersin?", false);
        }
      }catch{
        history = [];
        addMessage("bot", "BilalAI: Merhaba! BilalAI'a hoşgeldin. Ne çözmek istersin?", false);
      }
    }

    sendBtn.addEventListener("click", sendMessage);

    inputEl.addEventListener("input", autoResize);

    inputEl.addEventListener("keydown", event => {
      if(event.key === "Enter" && !event.shiftKey){
        event.preventDefault();
        sendMessage();
      }
    });

    document.getElementById("clearBtn").addEventListener("click", clearChat);
    document.getElementById("clearTopBtn").addEventListener("click", clearChat);
    document.getElementById("newChatBtn").addEventListener("click", clearChat);

    document.getElementById("focusBtn").addEventListener("click", () => {
      inputEl.focus();
    });

    loadHistory();
    autoResize();
    inputEl.focus();
  </script>
</body>
</html>
